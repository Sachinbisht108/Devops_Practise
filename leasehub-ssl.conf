<VirtualHost *:443>
    ServerAdmin support@apmosys.com
    ServerName calc.quiklyz.com
	DocumentRoot "C:/xampp/apache/quiklyz"
	<Directory "C:/xampp/apache/quiklyz">
    AllowOverride None
    Options None
    Require all granted
    </Directory>

	DirectoryIndex index.html
    
    # Proxy settings
    ProxyPreServeHost On
    Timeout 600
    ProxyTimeout 600
    ProxyPass "/leasehub/" "http://localhost:8080/leasehub/"
    ProxyPassReverse "/leasehub/" "http://localhost:8080/leasehub/"
    
    # Log file locations for Windows
    ErrorLog "C:/xampp/apache/logs/calc.quiklyz.com-error_log"
    CustomLog "C:/xampp/apache/logs/calc.quiklyz.com-access_log" common

    # SSL Settings
    SSLEngine on
    SSLProxyEngine On
    SSLHonorCipherOrder On

    # Security Headers (commented out but can be enabled)
    # Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    # Header always set X-Frame-Options DENY
    # Header always set X-Content-Type-Options nosniff

    # SSL Protocols and Ciphers
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite EECDH+AESGCM:EDH+AESGCM

    # SSL Proxy Verification (for backend communication)
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off

    # SSL Certificate paths (adapted for Windows)
    SSLCertificateFile "C:/xampp/apache/conf/ssl/quiklyz_com.crt"
    SSLCertificateKeyFile "C:/xampp/apache/conf/ssl/quiklyz_com.key"
    SSLCertificateChainFile "C:/xampp/apache/conf/ssl/quiklyz_com_ca.crt"

    # SSL Options for CGI
    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>

    <Directory "C:/xampp/apache/cgi-bin/">
        SSLOptions +StdEnvVars
    </Directory>

    # Browser compatibility for older versions of Internet Explorer
    BrowserMatch "MSIE [2-5]" \
        nokeepalive ssl-unclean-shutdown \
        downgrade-1.0 force-response-1.0

    # Custom log format for SSL
    CustomLog "C:/xampp/apache/logs/calc.quiklyz.com_request_log" \
        "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"
</VirtualHost>

